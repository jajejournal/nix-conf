# This file is automatically generated by home-manager.
# See ~/.config/picom/picom.conf for editing instructions.
shadow = true;
shadow-radius = 6;
shadow-offset-x = -5;
shadow-offset-y = -5;
shadow-opacity = 0.55;

fading = true;
fade-in-step = 0.03;
fade-out-step = 0.03;

frame-opacity = 0.5;
inactive-dim-fixed = true;
corner-radius = 0;

blur-method = "dual_kawase";
blur-size = 12;
blur-deviation = false;
blur-strength = 5;
blur-kern = "3x3box";

backend = "glx";
vsync = true;

detect-rounded-corners = true;
detect-client-opacity = true;
detect-transient = true;
use-damage = true;

opacity-rule = [
  "95:class_g = 'Alacritty'",
  "90:class_g = 'Rofi'",
  "95:class_g = 'Polybar'",
  "85:window_type = 'dock'"
];
